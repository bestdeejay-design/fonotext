name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка границ публичного контура
        run: python3 tools/check-boundaries.py docs README.md --profile public

  site-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Технический аудит сайта
        run: python3 tools/site-audit.py

  demo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Структурный аудит демо-панели (HTML-теги, якоря, доступность)
        run: python3 tools/demo-html-audit.py
      - name: Правки демо-панели не должны расходиться с зафиксированными
        # fix-demo-audit.py идемпотентен: если он что-то меняет — файлы разъехались
        # с эталоном, и это нужно закоммитить.
        run: |
          python3 tools/fix-demo-audit.py
          if ! git diff --quiet -- docs/demo/; then
            echo "::error::docs/demo/ разошёлся с эталоном — запустите tools/fix-demo-audit.py и закоммитьте результат"
            git --no-pager diff --stat -- docs/demo/
            exit 1
          fi
