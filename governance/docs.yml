# Реестр документации публичного контура.
#
# Здесь живут только постоянные документы: страницы сайта, спецификации, правила,
# шаблоны. Артефакты (ресёрч, аудит, отчёты) сюда не вносятся — они сами объявляют
# себя шапкой <!-- artifact … --> в файле, см. governance/DOCS.md §4.
#
# Правила заполнения:
#   path        — путь от корня репозитория, ровно как в git
#   title       — короткое человеческое имя для индекса (не H1)
#   type        — см. type_order ниже
#   status      — active | draft | deprecated | archived | tombstone
#   owner       — product | tech | governance
#   review_days — через сколько дней документ обязан пройти ревизию (по умолчанию limits.default_review_days)
#   build       — html (собирается tools/build-docs-html.py) | handwritten | generated | none
#   superseded_by — обязателен для deprecated/archived: путь или URL замены
#
# Даты последней правки здесь не хранятся: они берутся из git, чтобы реестр
# не расходился с историей.

version: 1
updated: 2026-11-04
contour: public

limits:
  default_review_days: 180
  artifact_review_days: 180
  stale_artifact_days: 120
  overdue_grace_days: 90

type_order: [landing, page, spec, policy, recurring, template, guide, legal, tombstone]

type_titles:
  landing: Точка входа
  page: Страницы сайта
  spec: Спецификации функций
  policy: Правила и регламенты
  recurring: Регулярные проверки
  template: Шаблоны
  guide: Инструкции
  legal: Юридическое
  tombstone: Снято с публикации

managed:
  - "*.md"
  - "docs/**/*.md"
  - "governance/**/*.md"
  - "local-poc/**/*.md"
  - "artifacts/**/*.md"

exclude:
  - "governance/DOCS-INDEX.md"

artifacts:
  types: [research, audit, report, decision, handoff]
  areas:
    - path: "artifacts/**"
      strict: true

